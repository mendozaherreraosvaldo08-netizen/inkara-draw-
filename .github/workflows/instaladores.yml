# Arma los instaladores de Inkara Draw en los servidores de GitHub (gratis):
#   Windows: InkaraDraw-Windows.exe   (doble clic y se instala solo)
#   Linux:   InkaraDraw-Linux.AppImage (doble clic y abre)
#   Mac:     InkaraDraw-Mac.dmg        (sin firma: la primera vez "Abrir igualmente")
# Se ejecuta cuando cambia package.json en main (al subir de versión) o a mano
# (pestaña Actions › "Instaladores" › Run workflow). Publica un Release "vX.Y.Z" con los
# tres archivos; la página usa el enlace fijo releases/latest/download/...
name: Instaladores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/instaladores.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            files: release/*.AppImage
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          # Sin certificado de firma: Windows dirá "editor desconocido" la primera vez.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    # Publica lo que sí se armó aunque un sistema falle.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Inkara Draw ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            Persigue tus ideas. Inkara las llena de color.
            Descarga el instalador de tu computadora: Windows (.exe), Mac (.dmg) o Linux (.AppImage).
          files: instaladores/*
